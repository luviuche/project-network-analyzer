# Alembic configuration. The database URL is not set here: migrations/env.py
# reads PNA_DATABASE_URL through config.py, like the application does.
#
#     alembic upgrade head        # apply every migration
#     alembic downgrade -1        # undo the latest one
#     alembic revision --autogenerate -m "..."   # draft one from the models

[alembic]
script_location = %(here)s/migrations
# Makes the package importable from a fresh clone, without an install.
prepend_sys_path = src
path_separator = os
# Migration files sort by creation date: 20260929_1200_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
